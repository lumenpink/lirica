name: CI & Deployment

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Tests
        run: cargo test

      - name: Quality Gate (fmt & clippy)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build WebAssembly Bundle
        run: |
          wasm-pack build --target web --out-dir site/pkg --release
          rm -f site/pkg/.gitignore

      - name: Verify WebAssembly Artifacts
        run: |
          test -f site/pkg/lirica.js || exit 1
          test -f site/pkg/lirica_bg.wasm || exit 1
          echo "WASM artifacts verified successfully."
