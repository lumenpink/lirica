name: CI & Deployment

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-wasm:latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Rust toolchain
        run: |
          rustc --version
          rustup target list --installed

      - name: Run Tests
        run: cargo test --all-targets

      - name: Quality Gate (fmt & clippy)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build WebAssembly Bundle
        run: |
          wasm-pack build --target web --out-dir site/pkg --release
          rm -f site/pkg/.gitignore

      - name: Upload Site Bundle for Kombinat
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GAMBI_2LP_IN_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          cccp package upload site
