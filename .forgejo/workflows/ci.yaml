name: CI & Deployment

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-wasm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Rust toolchain
        run: |
          rustc --version
          rustup target list --installed

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Tests
        run: cargo test

      - name: Quality Gate (fmt & clippy)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler pages deploy site --project-name=lirica --branch=main --commit-dirty=true
          else
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando deploy."
          fi
