[package]
name = "lirica"
version = "0.1.0-dev.47+20261109.1e4cad1"
edition = "2021"
description = "Laboratório métrico e escansão poética em WebAssembly"
license = "Apache-2.0"
repository = "https://github.com/lumenpink/lirica"
homepage = "https://lirica.2lp.in"
authors = ["Lumen Pink <hi@lumen.pink>"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
joaju-lirica = { version = "0.5.1-dev.37", registry = "gambi" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
